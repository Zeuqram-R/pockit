name: Pockit
options:
  bundleIdPrefix: com.zeuqram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.23"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconPin AppIconMarisol"
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Pockit:
    type: application
    platform: iOS
    sources:
      - path: Pockit/Sources
      - path: Pockit/Resources
    info:
      path: Pockit/Info.plist
      properties:
        CFBundleDisplayName: PockIt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [BarlowCondensed-SemiBold.ttf, BarlowCondensed-Bold.ttf, Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-SemiBold.ttf]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: Para tomarle foto a la tele y preguntarle a Marisol.
        NSPhotoLibraryUsageDescription: Para mandarle a Marisol un screenshot del PS5.
        NSMicrophoneUsageDescription: Para hablarle a Marisol sin soltar el control.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeuqram.pockit
