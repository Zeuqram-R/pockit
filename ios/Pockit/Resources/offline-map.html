<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #2F90B0; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #gtab-map, .gtab-view { position: absolute; inset: 0; background: #2F90B0; }
  /* Nombres según el zoom, igual que en GTABase: lejos solo condados; después ciudades y regiones; luego pueblos; de cerca, barrios */
  .gtab-county-label, .gtab-place-label { width: 0 !important; height: 0 !important; margin: 0 !important; background: none; border: 0; pointer-events: none; }
  .gtab-county-label span, .gtab-place-label span { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; color: #fff;
    text-transform: uppercase; font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; line-height: 1; }
  .gtab-county-label span { font-weight: 600; font-size: 14px; letter-spacing: .04em;
    text-shadow: 0 0 1px #15112B, 0 0 2px rgba(21,17,43,.9), 0 1px 4px rgba(21,17,43,.55); }
  .gtab-place-label span { font-weight: 600; font-size: 13px; letter-spacing: .05em; text-shadow: 0 0 2px rgba(21,17,43,.9), 0 1px 3px rgba(21,17,43,.8); }
  .gtab-place-region span { color: #F4F1E8; font-weight: 500; letter-spacing: .12em; }
  .gtab-place-city span { font-weight: 700; }
  .gtab-place-district span { font-weight: 500; color: #F4F1E8; letter-spacing: .06em; }
  .pkl[data-z="-1"] .gtab-place-label, .pkl[data-z="0"] .gtab-place-town, .pkl[data-z="1"] .gtab-place-town { display: none; }
  .pkl:not([data-z="4"]):not([data-z="5"]):not([data-z="6"]) .gtab-place-district { display: none; }
  .pkl[data-z="-1"] .gtab-county-label span { font-size: 12px; } .pkl[data-z="0"] .gtab-county-label span { font-size: 13px; }
  .pkl[data-z="1"] .gtab-county-label span { font-size: 15px; } .pkl[data-z="2"] .gtab-county-label span { font-size: 18px; }
  .pkl[data-z="3"] .gtab-county-label span { font-size: 22px; } .pkl[data-z="4"] .gtab-county-label span { font-size: 26px; }
  .pkl[data-z="5"] .gtab-county-label span, .pkl[data-z="6"] .gtab-county-label span { font-size: 30px; }
  .pkl[data-z="0"] .gtab-place-label span { font-size: 9px; } .pkl[data-z="1"] .gtab-place-label span, .pkl[data-z="2"] .gtab-place-label span { font-size: 10px; }
  .pkl[data-z="2"] .gtab-place-region span, .pkl[data-z="2"] .gtab-place-city span { font-size: 12px; }
  .pkl[data-z="3"] .gtab-place-label span { font-size: 12px; } .pkl[data-z="3"] .gtab-place-region span, .pkl[data-z="3"] .gtab-place-city span { font-size: 14px; }
  .pkl[data-z="4"] .gtab-place-label span { font-size: 15px; } .pkl[data-z="4"] .gtab-place-region span, .pkl[data-z="4"] .gtab-place-city span { font-size: 18px; }
  .pkl[data-z="5"] .gtab-place-label span { font-size: 18px; } .pkl[data-z="5"] .gtab-place-region span, .pkl[data-z="5"] .gtab-place-city span { font-size: 24px; }
  .pkl[data-z="6"] .gtab-place-label span { font-size: 22px; } .pkl[data-z="6"] .gtab-place-region span, .pkl[data-z="6"] .gtab-place-city span { font-size: 30px; }
  .leaflet-container { background: #2F90B0; }
</style>
</head>
<body>
<div id="gtab-map" class="gtab-root"><div class="gtab-view"></div></div>
<script src="leaflet.js"></script>
<script>
// Pockit · mapa guardado para usar sin internet. Todo sale del teléfono (pkoffline://).
(function () {
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  fetch("pkoffline://data/snapshot.json").then(function (r) { return r.json(); }).then(function (S) {
    var t = S.crs || [0.03125, 512, -0.03125, 512];
    var crs = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(t[0], t[1], t[2], t[3]) });
    var map = L.map(document.querySelector(".gtab-view"), {
      crs: crs, minZoom: -1, maxZoom: 6, zoomSnap: 1, zoomControl: false, attributionControl: false
    });
    if (S.sea) { document.body.style.background = S.sea; document.querySelector(".gtab-view").style.background = S.sea; }
    var tl = S.tile || {};
    L.tileLayer("pkoffline://tiles/{z}/{z},{y},{x}.jpg", {
      tileSize: tl.tileSize || 128, zoomOffset: tl.zoomOffset == null ? 1 : tl.zoomOffset,
      minZoom: -1, maxZoom: 18, minNativeZoom: -1, maxNativeZoom: tl.maxNativeZoom || 5, keepBuffer: 4,
      bounds: tl.bounds ? L.latLngBounds(tl.bounds) : undefined,
      errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
    }).addTo(map);
    var pane = map.createPane("pklabels");
    pane.style.zIndex = 640;
    pane.classList.add("pkl");
    var setZ = function () { pane.setAttribute("data-z", String(Math.round(map.getZoom()))); };
    map.on("zoomend", setZ);
    (S.labels || []).forEach(function (l) {
      var cls = l.kind === "county" ? "gtab-county-label" : "gtab-place-label gtab-place-" + (l.sub || "town");
      L.marker([l.lat, l.lng], { pane: "pklabels", interactive: false, keyboard: false,
        icon: L.divIcon({ className: cls, html: "<span>" + esc(l.t) + "</span>", iconSize: null })
      }).addTo(map);
    });
    var island = S.island ? L.latLngBounds(S.island) : map.getBounds();
    map.fitBounds(island);
    setZ();
    window.GTAB_CONFIG = { assetPath: "pkoffline://", sea: S.sea };
    window.GTAB_ICONS = S.icons || {};
    window.GTAB = {
      map: map,
      entries: (S.entries || []).map(function (e) { return { data: e }; }),
      categoryById: S.cats || {},
      worldToLatLng: function (x, y) { return L.latLng(y, x); },
      islandBounds: island,
      offline: true
    };
  }).catch(function () {
    try { window.webkit.messageHandlers.pockitMap.postMessage({ type: "error", reason: "no-offline-data" }); } catch (e) {}
  });
})();
</script>
</body>
</html>
