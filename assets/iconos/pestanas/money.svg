<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 56 440 440" width="512" height="512">
  <defs>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
  </defs>
  <!-- billete de atrás (teal) -->
  <g transform="rotate(-14 240 220)">
    <rect x="70" y="120" width="340" height="190" rx="28" fill="#2EC4B6" stroke="#0E0818" stroke-width="18"/>
    <circle cx="240" cy="215" r="44" fill="none" stroke="#167E78" stroke-width="12"/>
  </g>
  <!-- billete de adelante -->
  <g transform="rotate(-4 250 270)">
    <rect x="56" y="170" width="360" height="200" rx="28" fill="url(#bill)" stroke="#0E0818" stroke-width="18"/>
    <rect x="84" y="196" width="304" height="148" rx="16" fill="none" stroke="#C9542C" stroke-width="8" opacity="0.7"/>
    <path d="M312 182 Q404 182 404 250 L404 358 L312 358 Z" fill="#E8693A" opacity="0.35"/>
    <circle cx="236" cy="270" r="52" fill="#FFF4E6" stroke="#0E0818" stroke-width="12"/>
    <text x="236" y="296" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="78" fill="#FF3E8A" stroke="#0E0818" stroke-width="5" paint-order="stroke">$</text>
  </g>
  <!-- moneda -->
  <circle cx="378" cy="372" r="86" fill="#0E0818"/>
  <circle cx="378" cy="372" r="72" fill="url(#coin)"/>
  <circle cx="378" cy="372" r="52" fill="none" stroke="#E08E1F" stroke-width="10"/>
  <text x="378" y="400" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="76" fill="#0E0818">$</text>
  <path d="M332 330 Q352 312 378 310" fill="none" stroke="#FFF6D8" stroke-width="9" stroke-linecap="round"/>
</svg>
