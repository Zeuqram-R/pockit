<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 452 452" width="512" height="512">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE0D0"/><stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-8 256 270)">
    <!-- fajo: billetes de atrás, cada uno un poco más abajo -->
    <rect x="70" y="196" width="350" height="190" rx="24" fill="#167E78" stroke="#0E0818" stroke-width="16"/>
    <rect x="70" y="168" width="350" height="190" rx="24" fill="#1F9E95" stroke="#0E0818" stroke-width="16"/>
    <rect x="70" y="140" width="350" height="190" rx="24" fill="#27B3A7" stroke="#0E0818" stroke-width="16"/>
    <!-- billete de adelante -->
    <rect x="70" y="112" width="350" height="190" rx="24" fill="url(#front)" stroke="#0E0818" stroke-width="18"/>
    <rect x="96" y="136" width="298" height="142" rx="14" fill="none" stroke="#167E78" stroke-width="8" opacity="0.8"/>
    <!-- sombra cel -->
    <path d="M330 122 Q410 120 410 180 L410 290 L330 290 Z" fill="#1F9E95" opacity="0.45"/>
    <!-- medallón con el $ rosa -->
    <circle cx="190" cy="207" r="56" fill="#FFF4E6" stroke="#0E0818" stroke-width="12"/>
    <text x="190" y="236" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="84" fill="#FF3E8A" stroke="#0E0818" stroke-width="6" paint-order="stroke">$</text>
    <!-- faja de papel del fajo -->
    <rect x="300" y="100" width="58" height="300" rx="8" fill="#FFF4E6" stroke="#0E0818" stroke-width="14"/>
    <rect x="312" y="114" width="34" height="272" rx="4" fill="#FF3E8A"/>
    <line x1="329" y1="124" x2="329" y2="376" stroke="#FF9CC2" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
