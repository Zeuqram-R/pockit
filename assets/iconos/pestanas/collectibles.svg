<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 432 432" width="512" height="512">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E3FA0"/><stop offset="1" stop-color="#5E2670"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="0.5" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3E8A"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE0D0"/><stop offset="0.5" stop-color="#E5D6F2"/><stop offset="1" stop-color="#FF6FA6"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 256 256)">
    <!-- tapa del álbum detrás -->
    <rect x="118" y="70" width="290" height="372" rx="26" fill="url(#cover)" stroke="#0E0818" stroke-width="18"/>
    <!-- página con fundas -->
    <rect x="100" y="86" width="284" height="356" rx="20" fill="#FFF4E6" stroke="#0E0818" stroke-width="18"/>
    <path d="M300 96 Q374 96 374 140 L374 432 L300 432 Z" fill="#EBD7C2" opacity="0.6"/>
    <!-- anillas -->
    <g fill="none" stroke="#0E0818" stroke-width="22" stroke-linecap="round">
      <path d="M86 140 L130 140"/><path d="M86 264 L130 264"/><path d="M86 388 L130 388"/>
    </g>
    <g fill="none" stroke="#C9CCD6" stroke-width="10" stroke-linecap="round">
      <path d="M90 140 L126 140"/><path d="M90 264 L126 264"/><path d="M90 388 L126 388"/>
    </g>

    <!-- carta 1: sunset -->
    <rect x="148" y="116" width="96" height="134" rx="10" fill="url(#sun)" stroke="#0E0818" stroke-width="10"/>
    <rect x="160" y="128" width="72" height="72" rx="6" fill="#FFF4E6" stroke="#0E0818" stroke-width="5"/>
    <circle cx="196" cy="164" r="20" fill="#6B2D7B"/>
    <rect x="162" y="212" width="68" height="10" rx="5" fill="#FFF4E6"/>
    <rect x="162" y="228" width="44" height="8" rx="4" fill="#FFF4E6" opacity="0.8"/>

    <!-- carta 2: holográfica -->
    <rect x="262" y="116" width="96" height="134" rx="10" fill="url(#holo)" stroke="#0E0818" stroke-width="10"/>
    <rect x="274" y="128" width="72" height="72" rx="6" fill="#1B1030" stroke="#0E0818" stroke-width="5"/>
    <path d="M310 142 L316 158 L332 164 L316 170 L310 186 L304 170 L288 164 L304 158 Z" fill="#FFE08A"/>
    <rect x="276" y="212" width="68" height="10" rx="5" fill="#1B1030" opacity="0.8"/>
    <rect x="276" y="228" width="44" height="8" rx="4" fill="#1B1030" opacity="0.6"/>
    <path d="M268 244 L352 124" stroke="#FFFFFF" stroke-width="8" opacity="0.5" stroke-linecap="round"/>

    <!-- carta 3: teal -->
    <rect x="148" y="272" width="96" height="134" rx="10" fill="#2EC4B6" stroke="#0E0818" stroke-width="10"/>
    <rect x="160" y="284" width="72" height="72" rx="6" fill="#FFF4E6" stroke="#0E0818" stroke-width="5"/>
    <path d="M178 344 L196 300 L214 344 Z" fill="#FF3E8A"/>
    <rect x="162" y="368" width="68" height="10" rx="5" fill="#FFF4E6"/>
    <rect x="162" y="384" width="44" height="8" rx="4" fill="#FFF4E6" opacity="0.8"/>

    <!-- funda vacía con ? -->
    <rect x="262" y="272" width="96" height="134" rx="10" fill="#F3E4F7" stroke="#0E0818" stroke-width="8" stroke-dasharray="14 10"/>
    <text x="310" y="366" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="74" fill="#B9A3D3">?</text>

    <!-- brillo de las fundas plásticas -->
    <path d="M150 108 L376 108" stroke="#FFFFFF" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  </g>
  <!-- destello -->
  <path d="M410 72 L418 96 L442 104 L418 112 L410 136 L402 112 L378 104 L402 96 Z" fill="#FFE08A" stroke="#0E0818" stroke-width="7" stroke-linejoin="round"/>
</svg>
