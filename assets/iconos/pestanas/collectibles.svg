<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A45AE"/><stop offset="1" stop-color="#5A2370"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1E5E"/><stop offset="1" stop-color="#6B2D7B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="0.5" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3E8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE0D3"/><stop offset="1" stop-color="#1E9C90"/>
    </linearGradient>
  </defs>

  <!-- tapa abierta hacia atrás -->
  <path d="M134 214 L148 48 Q150 34 166 34 L346 34 Q362 34 364 48 L378 214 Z" fill="url(#lid)" stroke="#0E0818" stroke-width="16" stroke-linejoin="round"/>

  <path d="M160 200 L170 58 L342 58 L352 200 Z" fill="#2A1240" opacity="0.7"/>
  <!-- cartas saliendo del deck -->
  <g transform="rotate(-12 256 300)">
    <rect x="176" y="86" width="120" height="170" rx="12" fill="url(#teal)" stroke="#0E0818" stroke-width="12"/>
    <rect x="190" y="100" width="92" height="142" rx="8" fill="none" stroke="#FFF4E6" stroke-width="6" opacity="0.8"/>
  </g>
  <g transform="rotate(10 256 300)">
    <rect x="216" y="80" width="120" height="170" rx="12" fill="url(#gold)" stroke="#0E0818" stroke-width="12"/>
    <rect x="230" y="94" width="92" height="142" rx="8" fill="none" stroke="#FFF4E6" stroke-width="6" opacity="0.8"/>
  </g>
  <g>
    <rect x="196" y="62" width="120" height="180" rx="12" fill="url(#sun)" stroke="#0E0818" stroke-width="12"/>
    <rect x="210" y="76" width="92" height="152" rx="8" fill="none" stroke="#FFF4E6" stroke-width="6"/>
    <ellipse cx="256" cy="140" rx="30" ry="38" fill="none" stroke="#FFF4E6" stroke-width="7"/>
    <circle cx="256" cy="140" r="11" fill="#FFF4E6"/>
    <path d="M222 92 L236 92 M276 92 L290 92" stroke="#FFF4E6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- cuerpo del protector -->
  <rect x="128" y="200" width="256" height="262" rx="28" fill="url(#box)" stroke="#0E0818" stroke-width="18"/>
  <!-- borde interior de la boca -->
  <path d="M146 216 L366 216" stroke="#2A1240" stroke-width="10" stroke-linecap="round"/>
  <!-- franja neón -->
  <rect x="137" y="258" width="238" height="18" fill="#FF3E8A" stroke="#0E0818" stroke-width="7"/>
  <!-- brillo lateral -->
  <path d="M156 296 L156 432" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.2"/>

  <!-- emblema rombo con ? -->
  <path d="M256 300 L310 356 L256 412 L202 356 Z" fill="#2A1240" stroke="#0E0818" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 314 L296 356 L256 398 L216 356 Z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <text x="256" y="376" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="52" fill="#FFB547" stroke="#0E0818" stroke-width="3">?</text>

  <!-- destello -->
  <path d="M420 70 L428 96 L454 104 L428 112 L420 138 L412 112 L386 104 L412 96 Z" fill="#FFE08A" stroke="#0E0818" stroke-width="7" stroke-linejoin="round"/>
</svg>
