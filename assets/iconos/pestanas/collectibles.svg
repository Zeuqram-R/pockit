<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A45AE"/><stop offset="1" stop-color="#5A2370"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1E5E"/><stop offset="1" stop-color="#6B2D7B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="0.5" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3E8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE0D3"/><stop offset="1" stop-color="#1E9C90"/>
    </linearGradient>
  </defs>

  <!-- tapa abierta hacia atrás -->
  <path d="M134 214 L148 48 Q150 34 166 34 L346 34 Q362 34 364 48 L378 214 Z" fill="url(#lid)" stroke="#0E0818" stroke-width="16" stroke-linejoin="round"/>

