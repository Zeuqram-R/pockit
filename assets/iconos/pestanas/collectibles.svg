<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 36 424 424" width="512" height="512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E3FA0"/><stop offset="1" stop-color="#5E2670"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1F5C"/><stop offset="1" stop-color="#241538"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="0.5" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3E8A"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6FA6" stop-opacity="0.55"/><stop offset="1" stop-color="#FF6FA6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- vitrina -->
  <rect x="104" y="64" width="304" height="380" rx="26" fill="url(#frame)" stroke="#0E0818" stroke-width="18"/>
  <rect x="132" y="104" width="248" height="304" rx="10" fill="url(#inside)" stroke="#0E0818" stroke-width="12"/>
  <!-- luz neón arriba -->
  <rect x="146" y="112" width="220" height="10" rx="5" fill="#FF3E8A"/>
  <path d="M146 122 L366 122 L366 240 L146 240 Z" fill="url(#spot)"/>

  <!-- repisas -->
  <rect x="132" y="244" width="248" height="16" fill="#FFB547" stroke="#0E0818" stroke-width="8"/>
  <rect x="132" y="376" width="248" height="16" fill="#FFB547" stroke="#0E0818" stroke-width="8"/>

  <!-- repisa de arriba: carta en su base + figura dorada -->
  <rect x="160" y="150" width="68" height="94" rx="8" fill="url(#sun)" stroke="#0E0818" stroke-width="8" transform="rotate(-8 194 197)"/>
  <rect x="172" y="162" width="44" height="40" rx="4" fill="#FFF4E6" transform="rotate(-8 194 197)"/>
  <path d="M262 244 L274 214 L264 192 Q284 168 304 192 L294 214 L306 244 Z" fill="url(#gold)" stroke="#0E0818" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="284" cy="176" r="14" fill="url(#gold)" stroke="#0E0818" stroke-width="7"/>
  <rect x="322" y="196" width="40" height="48" rx="6" fill="#2EC4B6" stroke="#0E0818" stroke-width="7"/>
  <circle cx="342" cy="214" r="9" fill="#FFF4E6"/>

  <!-- repisa de abajo: gema, moneda antigua y caja con ? -->
  <path d="M164 376 L150 340 L170 316 L204 316 L224 340 L210 376 Z" fill="#FF3E8A" stroke="#0E0818" stroke-width="8" stroke-linejoin="round"/>
  <path d="M166 334 L174 324" fill="none" stroke="#FFB3CF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="264" cy="350" r="26" fill="url(#gold)" stroke="#0E0818" stroke-width="8"/>
  <circle cx="264" cy="350" r="14" fill="none" stroke="#C98A2E" stroke-width="5"/>
  <rect x="306" y="318" width="56" height="58" rx="8" fill="#4A2A6A" stroke="#0E0818" stroke-width="7" stroke-dasharray="10 7"/>
  <text x="334" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="44" fill="#B9A3D3">?</text>

  <!-- vidrio: reflejos -->
  <path d="M150 400 L238 112" stroke="#FFFFFF" stroke-width="14" opacity="0.18" stroke-linecap="round"/>
  <path d="M186 400 L262 150" stroke="#FFFFFF" stroke-width="6" opacity="0.18" stroke-linecap="round"/>
  <!-- divisor de las dos puertas de vidrio -->
  <line x1="256" y1="104" x2="256" y2="408" stroke="#0E0818" stroke-width="6" opacity="0.5"/>
  <!-- patas -->
  <rect x="128" y="440" width="30" height="16" rx="5" fill="#0E0818"/>
  <rect x="354" y="440" width="30" height="16" rx="5" fill="#0E0818"/>

  <!-- destello -->
  <path d="M414 70 L421 92 L443 99 L421 106 L414 128 L407 106 L385 99 L407 92 Z" fill="#FFE08A" stroke="#0E0818" stroke-width="7" stroke-linejoin="round"/>
</svg>
