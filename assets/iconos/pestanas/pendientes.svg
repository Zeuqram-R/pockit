<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3E8A"/><stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/><stop offset="1" stop-color="#F6E3CF"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 256 270)">
    <!-- marcador teal -->
    <path d="M372 170 L432 170 L432 300 L402 278 L372 300 Z" fill="#2EC4B6" stroke="#0E0818" stroke-width="16" stroke-linejoin="round"/>
    <!-- hoja -->
    <rect x="96" y="104" width="300" height="350" rx="36" fill="url(#paper)" stroke="#0E0818" stroke-width="18"/>
    <!-- sombra cel de la hoja -->
    <path d="M300 113 Q378 112 386 150 L386 418 Q384 444 356 444 L300 444 Z" fill="#EBCFB6" opacity="0.65"/>
    <!-- encuadernado -->
    <rect x="96" y="104" width="300" height="74" rx="30" fill="url(#bind)" stroke="#0E0818" stroke-width="18"/>
    <rect x="96" y="150" width="300" height="28" fill="url(#bind)"/>
    <line x1="96" y1="178" x2="396" y2="178" stroke="#0E0818" stroke-width="18"/>
    <g fill="#0E0818">
      <rect x="140" y="82" width="22" height="58" rx="11"/>
      <rect x="208" y="82" width="22" height="58" rx="11"/>
      <rect x="276" y="82" width="22" height="58" rx="11"/>
      <rect x="344" y="82" width="22" height="58" rx="11"/>
    </g>
    <!-- fila 1: marcada -->
    <rect x="134" y="218" width="64" height="64" rx="14" fill="#2EC4B6" stroke="#0E0818" stroke-width="14"/>
    <line x1="222" y1="250" x2="352" y2="250" stroke="#B9A3D3" stroke-width="20" stroke-linecap="round"/>
    <!-- fila 2: vacía -->
    <rect x="134" y="316" width="64" height="64" rx="14" fill="#FFF8EE" stroke="#0E0818" stroke-width="14"/>
    <line x1="222" y1="348" x2="332" y2="348" stroke="#B9A3D3" stroke-width="20" stroke-linecap="round"/>
    <!-- fila 3 -->
    <line x1="140" y1="414" x2="290" y2="414" stroke="#D9C7EA" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- check rosa grande que se sale de la casilla -->
  <path d="M138 236 L176 276 L250 176" fill="none" stroke="#0E0818" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M138 236 L176 276 L250 176" fill="none" stroke="#FF3E8A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 238 L174 262" fill="none" stroke="#FF9CC2" stroke-width="7" stroke-linecap="round"/>
</svg>
